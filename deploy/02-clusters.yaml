# Two single-instance CNPG Clusters (design §11: "節點資源是 8 CPU / 8GB
# 且已有其他工作負載，所以 CNPG Cluster 用單 instance 節省資源"). No backup
# configuration — this is a throwaway e2e environment, not a durability test.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: tenant1-db
  namespace: pgproxy-e2e
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.6-system-trixie
  storage:
    size: 1Gi
  bootstrap:
    initdb:
      database: app
      owner: app_rw
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: tenant2-db
  namespace: pgproxy-e2e
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.6-system-trixie
  storage:
    size: 1Gi
  bootstrap:
    initdb:
      database: app
      owner: app_rw
